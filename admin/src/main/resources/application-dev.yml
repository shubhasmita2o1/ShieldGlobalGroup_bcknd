spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/shieldglobalgroups?ssl=false}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Admin@123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.security: DEBUG
    com.shielldglobalgroup.admin: DEBUG